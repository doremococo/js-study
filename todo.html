<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todoアプリ</title>
  </head>

  <body>
    <main class="container">
      <h1>Todoリスト</h1>

      <!-- Todo入力フォーム -->
      <form id="todo-form">
        <input
          id="todo-input"
          type="text"
          placeholder="やることを入力"
          autocomplete="off"
          required
        />
        <button type="submit">追加</button>
      </form>

      <!-- Todo一覧。JavaScriptでli要素を追加する -->
      <ul id="todo-list"></ul>
    </main>

    <script src="script.js"></script>
  </body>
</html>
